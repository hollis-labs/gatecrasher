openapi: 3.1.0
info:
  title: Gatecrasher approval API
  version: 1.0.0-draft
  summary: Submit approval requests, follow them, and verify signed decisions.
  description: |
    Gatecrasher is the portfolio's human-in-the-loop and approval service. Producers
    (Warden first; Cerberus and Tachyon later) submit an approval request for an exact
    operation or grant, follow it, and receive a signed decision they verify offline.

    Tiers:
    - `ground`: recorded only. The submit answers already `approved`, with a decision.
    - `elevated`: decided by an approver agent holding `approve.<class>` (`approver_class`
      is required), within per-class ceilings, or by the owner.
    - `critical`: decided by the owner, a human, only.

    Kinds: `credential_grant` (and any other kind) is approve/deny for `requested`.
    `choice` and `question` carry a `prompt` and are answered with `choice` or `answer`
    on decide. `secret_request` (always `critical`) carries a `secret_intake`; its card
    posts the value write-only to the producer's intake, and the producer reports it
    provided (`/secret-provided`).

    Surfaces (Tachyon, Basalisk, Surface/ADE) follow approvals on the event stream
    (`/api/gate/v1/events`) or a signed webhook, render `/card`, and call `/decide`.
    See docs/integration-guide.md.

    Go types for this contract are in `pkg/approvalapi` (module
    `github.com/hollis-labs/gatecrasher`). That package and this file must agree.

    Status: version 1, served from main (not yet deployed). Errors 503 `unavailable`
    when the operator has not configured approvals (an owner and producers).
  license:
    name: MIT
    identifier: MIT
security:
  - bearer: []
tags:
  - name: approvals
  - name: surfaces
  - name: keys
paths:
  /api/gate/v1/approvals:
    post:
      tags: [approvals]
      operationId: submitApproval
      summary: Submit an approval request
      description: |
        Scope `gatecrasher.approval.submit`.

        Idempotent on `idempotency_key`: the same key with the same `request_digest`
        returns the existing approval (200). The same key with a different digest is
        refused (409 `idempotency_conflict`).

        Gatecrasher recomputes `request_digest` from `principal`, `requested` and `tier`
        and refuses a mismatch (422 `digest_mismatch`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResponse' }
        '200':
          description: The approval already submitted under this idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/gate/v1/approvals/{id}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Get an approval's status
      description: Scope `gatecrasher.approval.read`.
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      responses:
        '200':
          description: The approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/gate/v1/approvals/{id}/await:
    get:
      tags: [approvals]
      operationId: awaitApproval
      summary: Long-poll until the approval is terminal or the timeout passes
      description: |
        Scope `gatecrasher.approval.read`. Answers as soon as the status is terminal.
        When the timeout passes first it answers 200 with the current (pending) status;
        it never answers 408. The timeout is capped at 60s.
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
        - name: timeout
          in: query
          required: false
          description: A Go-style duration, e.g. `30s`. Default 30s, maximum 60s.
          schema: { type: string, default: 30s, examples: ['30s'] }
      responses:
        '200':
          description: The approval, terminal or still pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/gate/v1/approvals/{id}/withdraw:
    post:
      tags: [approvals]
      operationId: withdrawApproval
      summary: Withdraw a pending approval
      description: |
        Scope `gatecrasher.approval.submit`, and only the submitting principal.
        Withdrawing an already withdrawn approval answers 200. Withdrawing an approval
        that is approved, denied or expired is refused (409 `terminal`).
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      responses:
        '200':
          description: The approval, now withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/gate/v1/approvals/{id}/decide:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Decide a pending approval (surfaces and approver agents)
      description: |
        Scope `gatecrasher.approval.decide`.
        - The owner (the verified caller whose id is the configured owner principal, user:<id> or key:<id>) may decide any pending approval;
          the decision carries `decider.kind: human` and the owner's registry id.
        - `elevated`: an approver agent configured for the class that also holds the
          class itself (`approve.<class>`) as an exact scope (wildcards never count).
          An agent's approval must fit the class ceiling after narrowing (403 `ceiling`);
          a denial is always allowed. In shadow mode the agent's decision is recorded
          only (202, `shadow: true`) and the approval stays pending for the owner.
        - `critical`: the owner only (403 `not_decider`).
        - `ground`: decided on arrival; deciding again is 409 `terminal`.
        A caller that may not see the approval gets 404. `narrowed` may only drop
        requested scopes or shorten the TTL (400).
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
      responses:
        '200':
          description: Decided; `decision` is the signed decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecideResponse' }
        '202':
          description: Recorded in shadow mode; the approval is still pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecideResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/gate/v1/approvals/{id}/secret-provided:
    post:
      tags: [approvals]
      operationId: secretProvided
      summary: Report that a secret_request's secret was provided (producer only)
      description: |
        Scope `gatecrasher.approval.submit`; only the submitter (404 otherwise). The owner
        posted the value to the producer's intake; the producer reports the intake and
        the reference it stored the value under. Gatecrasher records `intake_id`, `ref`
        and `provided_at` only, and closes the approval `approved` with a decision whose
        `decider` is the producer (`kind: app`, `sub` = its source) and whose `response`
        carries `secret_ref`. Reporting the same ref again answers the same; a different
        ref is 409. `ref` must match `^[A-Za-z0-9._:/@-]{1,256}$` (a reference, never a
        value).
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretProvidedRequest' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/gate/v1/approvals/{id}/card:
    get:
      tags: [surfaces]
      operationId: getCard
      summary: The approval as a transport-neutral card
      description: |
        Scope `gatecrasher.approval.read`, for a caller that may read the approval.
        Gatecrasher owns the card's content and the decide endpoint; how it is drawn is
        the surface's concern (the MCP UI work renders it in chats). A decided card has
        no actions and carries `outcome`; a closed `request_secret` card has no form.
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/gate/v1/events:
    get:
      tags: [surfaces]
      operationId: streamEvents
      summary: The approval event log as server-sent events
      description: |
        Scope `gatecrasher.approval.read`. `text/event-stream`; each event has `id` (its
        seq), `event: approval` and `data` a FeedEvent. Only events of approvals the
        caller may read are sent (the owner: all; a producer: its own; an approver agent:
        its classes' elevated requests). Resume with `Last-Event-ID` (or `?after=<seq>`);
        with neither the stream starts at the beginning of the log. An idle stream sends
        a `: keepalive` comment every 15 seconds. Event types: submitted, decided,
        shadow_decided, withdrawn, expired, secret_provided.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/FeedEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/gate/v1/jwks.json:
    get:
      tags: [keys]
      operationId: getJWKS
      summary: Keys that sign decisions
      description: |
        Scope `gatecrasher.approval.read`. Ed25519 keys (kty OKP, crv Ed25519).
        Every `/api/` route sits behind the host's auth guard, so the key set needs the
        read scope that producers already hold; fetch it once and cache it by `kid`.
      responses:
        '200':
          description: The key set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JWKS' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        A Gatecrasher API key with the route's scope. With `auth.trust: warden`, the
        approval routes also accept a Warden-issued EdDSA JWT with `aud: gatecrasher`,
        the configured issuer and the scopes in `scope`; its principal id is
        `warden:<sub>` and it is never the owner.
  parameters:
    ApprovalID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Refused. `code` is one of invalid, unauthorized, forbidden, not_found, idempotency_conflict, terminal, digest_mismatch, not_decider, ceiling, unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Tier:
      type: string
      enum: [ground, elevated, critical]
    Status:
      type: string
      enum: [pending, approved, denied, expired, withdrawn]
    PrincipalKind:
      type: string
      enum: [agent, session, machine, app, human]
    Actor:
      type: object
      required: [sub, kind]
      properties:
        sub: { type: string, description: Registry id. }
        kind: { $ref: '#/components/schemas/PrincipalKind' }
    Principal:
      type: object
      required: [sub, kind]
      properties:
        sub: { type: string, description: Registry id. }
        kind: { $ref: '#/components/schemas/PrincipalKind' }
        act:
          type: array
          description: The chain acting on the principal's behalf, outermost first. Omitted when empty.
          items: { $ref: '#/components/schemas/Actor' }
    Requested:
      type: object
      required: [audience, scopes, ttl_seconds, constraints]
      properties:
        audience: { type: string, examples: ['llm-gateway'] }
        scopes:
          type: array
          items: { type: string }
        ttl_seconds: { type: integer, minimum: 1, examples: [2592000] }
        constraints:
          type: object
          description: Always an object; `{}` when there are none.
          additionalProperties: true
    Evidence:
      type: object
      properties:
        task_id: { type: string }
        session_id: { type: string }
        policy_rule: { type: string }
    SubmitRequest:
      type: object
      required: [idempotency_key, source, kind, tier, principal, requested, purpose, request_digest, expires_at]
      properties:
        idempotency_key: { type: string, description: The producer's request id. }
        source: { type: string, examples: ['warden'] }
        kind:
          type: string
          description: credential_grant (or any other approve/deny kind), choice, question or secret_request.
          examples: [credential_grant, choice, question, secret_request]
        tier: { $ref: '#/components/schemas/Tier' }
        approver_class:
          type: string
          description: Required for `elevated`, refused otherwise.
          examples: ['approve.credentials']
        principal: { $ref: '#/components/schemas/Principal' }
        requested: { $ref: '#/components/schemas/Requested' }
        purpose: { type: string }
        evidence: { $ref: '#/components/schemas/Evidence' }
        request_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: |
            `sha256:` and the lowercase hex SHA-256 of the RFC 8785 (JCS) canonical JSON
            of `{"principal":…, "requested":…, "tier":…}`, with `act` omitted when empty,
            `constraints` always an object and `scopes` always an array.
            `approvalapi.RequestDigest` computes it.
        expires_at: { type: string, format: date-time }
        prompt:
          $ref: '#/components/schemas/Prompt'
        secret_intake:
          $ref: '#/components/schemas/SecretIntake'
      description: |
        `requested` needs `audience` and a positive `ttl_seconds` for grant kinds; for
        choice, question and secret_request it may be empty. `prompt` is required for
        choice (2 to 20 choices, unique ids `[A-Za-z0-9._-]`) and question (no choices).
        `secret_intake` is required for secret_request, whose tier must be `critical` and
        whose `intake_url` must be on an origin the operator allowed for the source
        (`approvals.intake_origins`). Neither field is in the request digest.
    Prompt:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 2000 }
        choices:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
              label: { type: string, maxLength: 200 }
    Response:
      type: object
      properties:
        choice: { type: string }
        answer: { type: string, maxLength: 4000 }
        secret_ref: { type: string }
    SecretProvidedRequest:
      type: object
      required: [intake_id, ref, provided_at]
      additionalProperties: false
      properties:
        intake_id: { type: string }
        ref: { type: string, pattern: '^[A-Za-z0-9._:/@-]{1,256}$' }
        provided_at: { type: string, format: date-time }
    Card:
      type: object
      description: |
        `version: gatecrasher.card/v1`. `type` is approve, choose, answer or
        request_secret. Each action other than provide_secret names its `decide` path;
        POST a DecideRequest with the action's `outcome` (plus `choice` or `answer`).
        provide_secret is the `secret` form: one field (`field`, "value") posted
        write-only to `secret.post_url`; a surface must keep the value out of any model
        transcript, log or store.
      required: [version, approval_id, type, status, tier, kind, source, title, principal, evidence, expires_at, deciders, actions]
      properties:
        version: { type: string, const: gatecrasher.card/v1 }
        approval_id: { type: string }
        type: { type: string, enum: [approve, choose, answer, request_secret] }
        status: { $ref: '#/components/schemas/Status' }
        tier: { $ref: '#/components/schemas/Tier' }
        kind: { type: string }
        source: { type: string }
        title: { type: string }
        summary: { type: string }
        principal: { $ref: '#/components/schemas/Principal' }
        requested: { $ref: '#/components/schemas/Requested' }
        evidence: { $ref: '#/components/schemas/Evidence' }
        prompt: { $ref: '#/components/schemas/Prompt' }
        expires_at: { type: string, format: date-time }
        deciders: { type: string, examples: ['owner', 'owner, approve.credentials'] }
        actions:
          type: array
          items:
            type: object
            required: [kind, label]
            properties:
              kind: { type: string, enum: [approve, deny, choose, answer, provide_secret] }
              label: { type: string }
              outcome: { type: string, enum: [approved, denied] }
              decide: { type: string }
        secret:
          type: object
          required: [intake_id, post_url, field, expires_at, write_only]
          properties:
            intake_id: { type: string }
            post_url: { type: string, format: uri }
            field: { type: string, const: value }
            expires_at: { type: string, format: date-time }
            write_only: { type: boolean, const: true }
        outcome:
          type: object
          properties:
            status: { $ref: '#/components/schemas/Status' }
            decider: { $ref: '#/components/schemas/Actor' }
            response: { $ref: '#/components/schemas/Response' }
    FeedEvent:
      type: object
      required: [seq, approval_id, type, at, status, tier, kind, source]
      properties:
        seq: { type: integer }
        approval_id: { type: string }
        type: { type: string, enum: [submitted, decided, shadow_decided, withdrawn, expired, secret_provided] }
        at: { type: string }
        status: { $ref: '#/components/schemas/Status', description: The approval's status now. }
        tier: { $ref: '#/components/schemas/Tier' }
        kind: { type: string }
        source: { type: string }
    WebhookDelivery:
      type: object
      description: |
        Body of a webhook POST to a configured subscriber, in log order, at least once.
        Header `Gatecrasher-Signature: t=<unix>,v1=<hex HMAC-SHA256("<t>.<body>")>` under
        the subscriber's key; `approvalapi.VerifyWebhook` checks it (5 minute tolerance).
        Header `Gatecrasher-Webhook` names the subscriber. Answer 2xx to advance.
      required: [subscriber, events]
      properties:
        subscriber: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/FeedEvent' }
    SubmitResponse:
      type: object
      required: [approval_id, status]
      properties:
        approval_id: { type: string }
        status: { $ref: '#/components/schemas/Status' }
    Approval:
      type: object
      required: [approval_id, status]
      properties:
        approval_id: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        decision:
          type: string
          description: The signed decision (compact JWS, see DecisionClaims). Present when status is approved or denied.
        secret:
          $ref: '#/components/schemas/SecretProvided' 
    DecideRequest:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [approved, denied] }
        narrowed:
          type: object
          description: Optional. Only drops requested scopes or shortens the TTL.
          properties:
            scopes: { type: array, items: { type: string } }
            ttl_seconds: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 2000, description: Kept in the approval's event log, not in the decision. }
        choice: { type: string, description: The chosen choice id, approving a choice request. }
        answer: { type: string, maxLength: 4000, description: The answer, approving a question request. }
    DecideResponse:
      allOf:
        - $ref: '#/components/schemas/Approval'
        - type: object
          properties:
            shadow: { type: boolean, description: True when recorded in shadow mode; the approval stays pending. }
    DecisionClaims:
      type: object
      description: |
        Claims of the signed decision: a compact JWS with header `alg: EdDSA`, a `kid`
        and `typ: gatecrasher-decision+jwt`, signed by a key in /api/gate/v1/jwks.json.
        `crit` headers are refused, and unknown claims are ignored.

        A producer checks the signature, `iss`, `aud` (itself), `exp` (and that
        `exp - iat` is at most 10 minutes), that `request_id`, `request_digest` and `tier`
        match what it submitted, that a `critical` decision has `decider.kind: human`
        and `decider.sub` equal to the owner's principal, and that `narrowed` only narrows.
        `approvalapi.VerifyDecision` and `DecisionClaims.Check` do this. An approved
        `secret_request` is the exception: its decider is the producer itself
        (`kind: app`, `sub` = `aud`) with `response.secret_ref`; pass
        `Expect.SecretRequest` to accept that.
      required: [iss, aud, jti, iat, exp, approval_id, request_id, request_digest, outcome, tier, decider, decided_at]
      properties:
        iss: { type: string, const: gatecrasher }
        aud: { type: string, examples: ['warden'] }
        jti: { type: string, description: Decision id. }
        iat: { type: integer, description: NumericDate. }
        exp: { type: integer, description: NumericDate; at most 10 minutes after iat. Redeem before it. }
        approval_id: { type: string }
        request_id: { type: string, description: The submit's idempotency_key. }
        request_digest: { type: string }
        outcome: { type: string, enum: [approved, denied] }
        tier: { $ref: '#/components/schemas/Tier' }
        decider: { $ref: '#/components/schemas/Actor' }
        decided_at: { type: string, format: date-time }
        narrowed:
          type: object
          description: Optional. Can only narrow; scopes a subset of those requested, TTL no longer.
          properties:
            scopes: { type: array, items: { type: string } }
            ttl_seconds: { type: integer, minimum: 1 }
        response: { $ref: '#/components/schemas/Response' }
    JWK:
      type: object
      required: [kty, crv, kid, x]
      properties:
        kty: { type: string, const: OKP }
        crv: { type: string, const: Ed25519 }
        kid: { type: string }
        x: { type: string, description: base64url public key, no padding. }
        use: { type: string, const: sig }
        alg: { type: string, const: EdDSA }
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/JWK' }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid, unauthorized, forbidden, not_found, idempotency_conflict, terminal, digest_mismatch, not_decider, ceiling, unavailable]
        message: { type: string }
    SecretIntake:
      type: object
      description: |
        request_secret. The producer (Warden) creates a one-use intake and puts it on
        the approval. Gatecrasher's card form posts the value write-only
        straight to `intake_url`. Gatecrasher never receives, stores or logs the value,
        and the value never enters a model transcript.
      required: [intake_id, intake_url, expires_at]
      properties:
        intake_id: { type: string }
        intake_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    SecretProvided:
      type: object
      description: All Gatecrasher records about a provided secret.
      required: [intake_id, ref, provided_at]
      properties:
        intake_id: { type: string }
        ref: { type: string, description: The reference the producer returned. }
        provided_at: { type: string, format: date-time }
