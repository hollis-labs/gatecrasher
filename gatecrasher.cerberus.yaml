# Process-supervision template. Configure and review for your environment before use.
kind: cerberus-project/v1
owner: gatecrasher
namespace: local
project:
  id: gatecrasher
  name: "Gatecrasher"
resources:
  - id: gatecrasher
    name: "Gatecrasher"
    type: process
    project: gatecrasher
    connector: local
    config:
      command:
        - "~/.local/bin/gatecrasher"
        - serve
        - --managed
        - --addr
        - 127.0.0.1:8080
      mode: os_service
      # Credentials come from operator config or the app's own identity provider.
      # env_file, when set, is a reference to an owner-only file outside the repository.
      port: 8080
      run_from: workspace
      supervisor: auto
      url: http://127.0.0.1:8080/healthz
      health_check:
        url: http://127.0.0.1:8080/healthz
    tags:
      - api
      - go
      - daemon
      - gatecrasher
