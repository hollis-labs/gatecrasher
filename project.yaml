    target_os: linux
    target_arch: amd64
    http_port: 8080
    binary_link: ~/.local/bin/gatecrasher
    install_root: ~/.local/share/fleet/releases/gatecrasher
    backup_database: ~/.local/share/gatecrasher/gatecrasher.db
