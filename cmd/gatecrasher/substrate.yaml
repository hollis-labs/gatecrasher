# gatecrasher on Substrate. The manifest is the shell: modules and config.
app: gatecrasher
variant: app-host
profiles: [agentic]
modules:
  add: [database, identity, cli]
  remove: [mcp]
config:
  logging: { level: info, format: text }
  httphost: { addr: "127.0.0.1:8080" }
  database:
    driver: sqlite
    sqlite: { path: gatecrasher.db, journal: wal, synchronous: FULL }
  auth: { mode: enforce }
  identity: { key_file: identity-signing.key, session_ttl: 12h, setup: offline }
  secrets: { state_dir: secrets }
  # The app's own block (internal/settings); the SUBSTRATE_CONFIG file overrides it key by key.
  gatecrasher:
    allowed_hosts: []
